version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: bykansla-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  web:
    build:
      context: ./web
    container_name: bykansla-web
    ports:
      - "3333:3000"
    env_file:
      - ./web/.env
    environment:
      - BACKEND_URL=http://backend:4000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev


